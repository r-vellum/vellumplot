url: https://r-vellum.github.io/vellumplot/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    # A parchment / sepia palette echoing the vellum & vellumplot hex logos.
    bg: "#faf5ea"
    fg: "#2c2113"
    primary: "#6b4f2c"
    secondary: "#8a7350"
    border-radius: "0.5rem"
    navbar-bg: "#efe6d2"
    navbar-light-brand-color: "#4a371f"
    link-color: "#7a5320"
    code-bg: "#f2e9d6"
    base_font: {google: "Spectral"}
    heading_font: {google: "Spectral SC"}
    code_font: {google: "JetBrains Mono"}
  includes:
    in_header: |
      <meta name="theme-color" content="#efe6d2">
  opengraph:
    twitter:
      creator: "@schochastics"
      card: summary_large_image

home:
  title: A grammar of graphics on the vellum backend
  description: >
    vellumplot is a declarative, pipe-first grammar of graphics. You describe a
    plot as an inspectable, serializable spec; nothing is drawn until the
    spec is compiled into a vellum scene and rendered.
  sidebar:
    structure: [ecosystem, links, license, community, citation, authors, dev]
    components:
      ecosystem:
        title: The ecosystem
        text: >
          [vellum](https://r-vellum.github.io/vellum/) · the parchment
          (backend)<br>
          [vellumplot](https://r-vellum.github.io/vellumplot/) · the pen (grammar)<br>
          [vellumwidget](https://r-vellum.github.io/vellumwidget/) · the annotation (interactivity)<br>
          [vellumverse](https://r-vellum.github.io/vellumverse/) · the
          bundle

