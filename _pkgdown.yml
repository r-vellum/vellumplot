reference:
- title: Building a plot
  desc: >
    Start a plot from a data frame, an `sf` object, or an `igraph` graph,
    then render it or write it to a file.
  contents:
  - vplot
  - vgraph
  - vdendrogram
  - vsankey
  - vchord
  - vhierarchy
  - vvenn
  - vwaffle
  - vsparkline
  - vtable
  - gt_vsparkline
  - render_plot
  - plot_svg
  - plot_data_uri
  - pdf_pages
  - render_all
  - PlotSpec

- title: Marks
  desc: Layers that draw data. Scales train across every mark on the panel.
- subtitle: Points, lines, and bars
  contents:
  - mark_point
  - mark_count
  - mark_area
  - mark_segment
  - mark_abline
- subtitle: Distributions and intervals
  contents:
  - mark_boxplot
  - mark_signif
  - mark_violin
  - mark_histogram
  - mark_ecdf
  - mark_ellipse
  - mark_halfeye
  - mark_raincloud
  - mark_tile
  - mark_contour
- subtitle: Text, pie, and large data
  contents:
  - mark_text
  - mark_text_path
  - mark_pie
  - mark_image
  - mark_datashade
- subtitle: Spatial and network
  contents:
  - mark_sf
  - map_decorations
  - mark_graph
  - scale_edge_width
  - scale_edge

- title: Scales
  desc: Map data values to visual properties, with trained domains and guides.
  contents:
  - scale_x_continuous
  - scale_x_binned
  - scale_x_date
  - scale_color_continuous
  - scale_viridis
  - scale_fill_binned
  - scale_shape
  - scale_pattern
  - scale_size
  - scale_alpha
  - scale_linetype
  - scale_color_identity
  - lims
  - sec_axis
  - guides
  - resolve_scale
  - after_stat

- title: Coordinates and facets
  contents:
  - coord_cartesian
  - coord_trans
  - coord_polar
  - coord_sf
  - facet_wrap
  - add_marginal
  - position

- title: Composition
  desc: Combine plots into a single figure, or repeat one over a variable.
  contents:
  - concat
  - inset
  - plot_spacer
  - area
  - repeat_
  - compose_annotation

- title: Themes and annotation
  contents:
  - theme_gray
  - theme_sketch
  - element
  - labs
  - annotate
  - md

- title: Layer effects
  desc: Glow, shadow, outline, motion trails, hand-drawn sketching, and gradient / pattern fills.
  contents:
  - glow
  - shadow
  - outline
  - motion
  - sketch
  - gradients
  - patterns
  - pattern_hatch
  - vl_pattern
  - clip

- title: Interactivity
  desc: >
    Declare interactions as part of the plot — selections bound to gestures,
    conditional encodings, filters, and scale-domain binds. Inert on a static
    render; enacted by a host such as vellumwidget.
  contents:
  - select_point
  - select_neighbours
  - condition
  - add_selection
  - filter_by
  - bind_scale
  - inspect_source
  - interaction_model

- title: Animation
  desc: >
    Non-reactive keyframe animation: compile a plot into one keyframe per state,
    train the scales once over all states and freeze them, then tween and encode
    the frames (GIF / APNG) in vellum's parallel Rust backend.
  contents:
  - transition_states
  - transition_time
  - transition_reveal
  - ease_aes
  - animate
  - anim_save

- title: Accessibility and provenance
  desc: >
    Attach a text alternative for screen readers, trace each drawn element back
    to its data, or verify a figure against the data it was drawn from.
  contents:
  - plot_alt
  - plot_lint
  - plot_provenance
  - provenance_join
  - provenance_payload
  - plot_manifest
  - plot_verify

- title: Specs, agents, and interoperability
  desc: >
    Serialize a plot to a portable spec (and back), generate and validate plots
    from an LLM / MCP agent, and translate to and from Vega-Lite.
  contents:
  - as_spec
  - spec_to_json
  - spec_schema
  - spec_fields
  - vplot_from_spec
  - vplot_ask
  - mcp_serve
  - spec_to_vegalite

- title: Package
  contents:
  - vellumplot-package

footer:
  structure:
    left: developed_by
    right: built_with
